version: "3.9"

services:
  # ── 백엔드 (FastAPI) ──────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: label-backend
    restart: unless-stopped
    env_file: ./backend/.env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── 프론트엔드 (Nginx + React PWA 빌드본) ─────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: label-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    environment:
      - VITE_API_BASE_URL=/api
